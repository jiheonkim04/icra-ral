rollout_action_semantics:
  official_entrypoint_required: lerobot-eval --env.type=libero
  exact_import_target: lerobot.scripts.lerobot_eval:main
  action_dim: 7
  chunk_size: 50
  n_action_steps: 50
  forbidden_rollout_paths:
    - old_exact_init_replay_bridge
    - custom_LIBERO_7D_adapter
    - local_normalization
    - hard_coded_gripper_conversion
    - adapter_weight_soup
  lerobot_eval_observed_order:
    - env_preprocessor
    - policy_preprocessor
    - policy.select_action
    - policy_postprocessor
    - env_postprocessor
    - env.step
  static_mix_semantics: >
    At each queue refill, evaluate frozen_base and rank4_lora on the identical
    official preprocessed observation, obtain corresponding action chunks,
    apply the official policy postprocessor to both corresponding chunks, mix
    them elementwise with the validation-selected alpha, then serve the mixed
    action queue to the official env postprocessor and env.step path.
  static_mix_single_action_after_independent_queues_allowed: false
  static_mix_compute_cost:
    model_forward_passes_per_queue_refill: 2
    model_forward_passes_per_env_step_at_refill: 2
    model_forward_passes_per_env_step_while_queue_nonempty: 0
    report_latency_and_vram_required: true

official_eval_readiness:
  env_status: MISSING_OFFICIAL_EVAL_DEPENDENCY
  env_type_libero_listed_by_help: true
  source_imports_libero_package: true
  missing_python_packages:
    - libero
    - robosuite
  native_windows_rollout_status: NEEDS_WSL_OR_LINUX_OR_DEPENDENCY_FIX
  official_eval_env_ready: false

closed_loop_rollout_protocol:
  status: FROZEN_NOT_EXECUTABLE_YET
  stage_a:
    name: bounded_readiness_pilot
    policies:
      - frozen_base
      - rank4_lora
      - validation_selected_action_space_static_mix
    lora_checkpoints_required: true
    seeds:
      - 11
      - 22
      - 33
    validation_seed_override_allowed_only_if_predeclared: true
    fixed_tasks_and_reset_seeds_required: true
    primary_metric: official_libero_success_rate
    required_logging:
      - episodes
      - steps
      - success_rate
      - exceptions
      - forward_passes_per_env_step
      - latency_per_action_or_chunk
      - peak_vram
      - wall_clock
  stage_b:
    name: scaleup_after_stage_a_passes
    requires_stage_a_pass: true
    add_confidence_intervals: true
    expand_tasks_and_reset_seeds: true
