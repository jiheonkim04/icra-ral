protocol_fix_branch: codex/fix-official-smolvla-rollout-protocol
final_decision: LORA_CHECKPOINTS_MISSING_REGENERATION_REQUIRED
decision_reason: >
  Exact local Hugging Face revisions are locked for the official SmolVLA-LIBERO
  model and LeRobot LIBERO dataset, and the rollout protocol is defined, but
  seed-specific official LoRA adapter checkpoints for seeds 11, 22, and 33 are
  not persisted. The local official LIBERO eval stack is also missing the libero
  and robosuite Python dependencies, so rollout execution remains blocked.

