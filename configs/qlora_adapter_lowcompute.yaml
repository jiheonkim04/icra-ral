run:
  name: qlora_adapter_lowcompute
  mode: required_memory_feasibility_track
  downloads_allowed: false
  gpu_training_allowed: false
  rollouts_allowed: false

backbone:
  name: smolvla
  freeze: true
  train_backbone: false
  openvla_oft_enabled: false

qlora:
  enabled: true
  explicit_config: true
  required_experiment_track_if_feasible: true
  required_feasibility_check: true
  main_novelty: false
  quantization_bits: 4
  rank: 8
  alpha: 16
  trainable_modules:
    - target_fusion_layers
    - action_head_projection
    - small_adapter_layers
  trainable_params_millions_estimate: 25

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 100
  full_finetune: false
  train_heads: true
  train_backbone: false

openvla_oft:
  enabled: false
  full_finetune: false
  full_rollout: false
  multiseed_sweep: false
