libero_offline_counterfactual_split_scaled:
  description: Deterministic local LIBERO HDF5-backed counterfactual split manifest for 32/64-record offline proxy scaling.

suites:
  - libero_10

max_tasks_per_suite: 10
max_demo_files: 64
max_counterfactual_pairs: 32
requires_h5py: true
offline_proxy_only: true
forbidden:
  - downloads
  - gpu_jobs
  - training
  - simulator_execution
  - rollouts
  - heavy_vla_imports
  - openvla_oft
  - paper_grade_claims
