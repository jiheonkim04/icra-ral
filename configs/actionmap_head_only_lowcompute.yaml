run:
  name: actionmap_head_only_lowcompute
  stage: head_only_offline_proxy
  seed: 0
  downloads_allowed: false
  gpu_training_allowed: false
  rollouts_allowed: false

backbone:
  name: smolvla
  checkpoint_env: SMOLVLA_CKPT
  freeze: true
  use_cached_features: true
  openvla_oft_enabled: false

head:
  name: actionmap
  train: true
  trainable_params_millions_estimate: 15
  target_conditioned: false
  counterfactual_alignment: false

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 300
  train_backbone: false
  train_heads: true
  precision: fp16_if_safe

heatmap:
  grid_size: 8
  low_resolution: true
  coarse_to_fine: false
  high_resolution_voxel_heatmap: false

openvla_oft:
  enabled: false
  full_finetune: false
  full_rollout: false
  multiseed_sweep: false
